[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpulse-backend"
version = "0.1.0"
description = "SignalPulse backend - real-time multi-source information intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.9",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.7",
    "alembic>=1.13",
]

[tool.setuptools]
packages = ["app", "app.core", "app.api", "app.api.routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]